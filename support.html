<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toy Haven - Support</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Toy Haven</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
      <a href="wishlist.html">Wishlist</a>
      <a href="support.html">Support</a>
    </nav>
  </header>

  <main>
    <h2>Contact & Support</h2>
    <form id="support-form">
      <input type="text" id="supp-name" placeholder="Your Name" required>
      <input type="email" id="supp-email" placeholder="Your Email" required>
      <textarea id="supp-msg" placeholder="Your Message" rows="4" required></textarea>
      <button type="submit">Submit Feedback</button>
    </form>
    <p id="supp-reply" style="color: green; text-align: center; margin-top: 0.5rem;"></p>

    <h2 style="margin-top: 3rem;">Frequently Asked Questions</h2>
    <div style="margin-top: 1rem;">
      <div class="accordion-item">
        <div class="accordion-header">How long does delivery take?</div>
        <div class="accordion-body">Standard shipping takes 3-5 business days.</div>
      </div>
      <div class="accordion-item">
        <div class="accordion-header">What is your return policy?</div>
        <div class="accordion-body">You can return items within 30 days of receipt.</div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
